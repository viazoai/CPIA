name: cpia

services:
  postgres:
    image: postgres:16-alpine
    container_name: cpia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpia}
      POSTGRES_DB: ${POSTGRES_DB:-cpia}
      TZ: Asia/Seoul
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpia} -d ${POSTGRES_DB:-cpia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cpia_net

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: cpia-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      TZ: Asia/Seoul
    ports:
      - "0.0.0.0:${CHROMA_PORT:-5533}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "curl -fsS http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cpia_net

  adminer:
    image: adminer:4.8.1-standalone
    container_name: cpia-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: cpia-postgres
      ADMINER_DESIGN: pepa-linha
      TZ: Asia/Seoul
    ports:
      - "0.0.0.0:${ADMINER_PORT:-5534}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cpia_net

  pipeline:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    image: cpia/pipeline:latest
    container_name: cpia-pipeline
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cpia}:${POSTGRES_PASSWORD:-cpia}@cpia-postgres:5432/${POSTGRES_DB:-cpia}
      CHROMA_HOST: cpia-chroma
      CHROMA_PORT: "8000"
      CHROMA_SSL: "false"
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.1-chat-ai-board-test}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small-ai-board-test}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      COLLECTOR_ENABLED: "false"
    ports:
      - "0.0.0.0:${PIPELINE_PORT:-5538}:8000"
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - cpia_net

  web:
    image: ghcr.io/viazoai/cpia-web:latest
    container_name: cpia-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      POSTGRES_URL: postgresql://${POSTGRES_USER:-cpia}:${POSTGRES_PASSWORD:-cpia}@cpia-postgres:5432/${POSTGRES_DB:-cpia}
      CHROMA_HOST: cpia-chroma
      CHROMA_PORT: "8000"
      FASTAPI_URL: http://cpia-pipeline:8000
      DATA_DIR: /app/data
    ports:
      - "0.0.0.0:${WEB_PORT:-5535}:5535"
    volumes:
      # fixtures.ts: path.join(process.cwd(), "..", "data") → /app/data
      # 업로드 (data/upload) 쓰기를 위해 rw 모드로 마운트.
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      pipeline:
        condition: service_started
    networks:
      - cpia_net
      - npm

volumes:
  postgres_data:
  chroma_data:

networks:
  cpia_net:
    driver: bridge
  npm:
    external: true
