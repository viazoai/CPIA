# Next.js dev 서버(HMR) + 전체 스택 한 번에 기동하는 오버라이드 파일.
#
# 직접 사용 시:
#   DEV_PORT=5536 DEV_CMD=dev:docker  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   DEV_PORT=5537 DEV_CMD=dev2:docker docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 권장: 루트의 Makefile 사용 → make dev / make dev2
#
# 첫 실행 시 npm install 이 약간 걸림 (이후 node_modules 는 named volume 에 캐시).
# 소스 변경 → HMR 즉시 반영 (재빌드 불필요).

services:
  web:
    build: !reset null          # 프로덕션 이미지 빌드 비활성화
    image: node:22-alpine
    container_name: cpia-web-dev
    working_dir: /app
    environment:
      NODE_ENV: development
      TZ: Asia/Seoul
      # 기본은 로컬 compose postgres. 외부(AWS) DB 를 보려면 DEV_DB_URL 로 override.
      # (POSTGRES_URL 이 아닌 전용 변수 — .env 의 localhost 용 POSTGRES_URL 과 충돌 방지)
      #   예: DEV_DB_URL='postgresql://USER:PASS@AWS_HOST:5432/cpia?sslmode=require' make dev2
      POSTGRES_URL: ${DEV_DB_URL:-postgresql://${POSTGRES_USER:-cpia}:${POSTGRES_PASSWORD:-cpia}@cpia-postgres:5432/${POSTGRES_DB:-cpia}}
      # Chroma 도 POSTGRES 와 동일하게 DEV_CHROMA_* 로 외부(AWS) 공유 override.
      #   미설정 시 로컬 cpia-chroma(컨테이너). split-brain 방지 위해 postgres 와 짝 맞춤.
      CHROMA_HOST: ${DEV_CHROMA_HOST:-cpia-chroma}
      CHROMA_PORT: "${DEV_CHROMA_PORT:-8000}"
      FASTAPI_URL: http://cpia-pipeline:8000
      NEXT_PUBLIC_DEMO_RESET: "1"
      DATA_DIR: /app/data
      WATCHPACK_POLLING: "true"
    ports:
      - "0.0.0.0:${DEV_PORT:-5537}:${DEV_PORT:-5537}"
    volumes:
      - ../web:/app
      - ../data:/app/data
      - web_dev_modules:/app/node_modules
    command: sh -c "npm install --prefer-offline && npm run ${DEV_CMD:-dev2:docker}"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      pipeline:
        condition: service_started
    networks:
      - cpia_net
      - npm
    restart: unless-stopped

  # dev 워크플로에서는 파이프라인도 web 과 같은 DB(DEV_DB_URL)를 보게 통일.
  # → make dev/dev2 시 DEV_DB_URL 하나로 web·pipeline 이 같은 DB 를 바라봄 (split-brain 방지).
  #   DEV_DB_URL 미설정이면 로컬 cpia-postgres(컨테이너) 사용.
  pipeline:
    environment:
      POSTGRES_URL: ${DEV_DB_URL:-postgresql://${POSTGRES_USER:-cpia}:${POSTGRES_PASSWORD:-cpia}@cpia-postgres:5432/${POSTGRES_DB:-cpia}}
      # web 과 동일하게 Chroma 도 DEV_CHROMA_* 로 통일 (Mapper RAG·Forecaster 유사이력이 같은 컬렉션을 봐야 함).
      CHROMA_HOST: ${DEV_CHROMA_HOST:-cpia-chroma}
      CHROMA_PORT: "${DEV_CHROMA_PORT:-8000}"

volumes:
  web_dev_modules:
